services:
  - type: worker
    name: bulldrop-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DB_PATH
        value: /var/data/bulldrop.sqlite3
    disk:
      name: bulldrop-data
      mountPath: /var/data
      sizeGB: 1
